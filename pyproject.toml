[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "teams-reader"
dynamic = ["version"]
description = "Read-only Microsoft Teams CLI and MCP server for AI agents, built on CLI for Microsoft 365."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Salal Aslam" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["microsoft-teams", "microsoft-graph", "m365", "cli", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
teams-reader = "teams_reader.cli:main"
teams-read = "teams_reader.cli:main"

[project.urls]
Homepage = "https://github.com/salalaslam/teams-reader"
Issues = "https://github.com/salalaslam/teams-reader/issues"

[tool.hatch.version]
path = "src/teams_reader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_reader"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "admin-approval.md", "account.example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
